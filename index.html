<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد الشخصي الذكي</title>
  <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="style/style.css">
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container"><!-- Header -->
   <header class="header">
    <div class="current-time" id="currentTime">
     00:00
    </div>
    <h1 class="main-title" id="mainTitle">المساعد الشخصي الذكي</h1>
    <p class="greeting" id="greeting">صباح الخير! 🌅</p>
   </header><!-- Timer -->
   <div class="neon-card">
    <h2 class="card-title" id="timerTitle">المؤقت الذكي</h2>
    <div class="timer-container">
     <div class="timer-display" id="timerDisplay">
      00:00
     </div>
     <div class="timer-controls"><button class="btn btn-success btn-small" id="startBtn" onclick="startTimer()">▶️ تشغيل</button> <button class="btn btn-warning btn-small" id="pauseBtn" onclick="pauseTimer()" style="display:none;">⏸️ إيقاف مؤقت</button> <button class="btn btn-secondary btn-small" onclick="resetTimer()">🔄 إعادة تعيين</button>
     </div>
     <div class="timer-presets"><button class="preset-btn" onclick="setTimer(5)">5 دقائق</button> <button class="preset-btn" onclick="setTimer(10)">10 دقائق</button> <button class="preset-btn" onclick="setTimer(15)">15 دقائق</button> <button class="preset-btn" onclick="setTimer(25)">25 دقيقة</button> <button class="preset-btn" onclick="setTimer(30)">30 دقيقة</button> <button class="preset-btn" onclick="setTimer(45)">45 دقيقة</button> <button class="preset-btn" onclick="setTimer(60)">60 دقيقة</button>
     </div>
    </div>
   </div><!-- Schedule -->
   <div class="neon-card">
    <h2 class="card-title" id="scheduleTitle">جدولك اليوم</h2>
    <div id="scheduleList"></div><button class="btn btn-small" onclick="openAddScheduleModal()" style="margin-top: 15px;"> ➕ إضافة حصة </button>
   </div><!-- Goals -->
   <div class="neon-card">
    <h2 class="card-title" id="goalsTitle">أهدافك اليومية</h2>
    <div id="goalsList"></div><button class="btn btn-small" onclick="openAddGoalModal()" style="margin-top: 15px;"> ➕ إضافة هدف </button>
   </div><!-- Stats -->
   <div class="neon-card">
    <h2 class="card-title" id="statsTitle">إحصائيات اليوم</h2>
    <div class="stats-grid">
     <div class="stat-box">
      <div class="stat-value" id="waterCount">
       0
      </div>
      <div class="stat-label">
       أكواب الماء
      </div>
      <div class="stat-controls"><button class="btn btn-small" onclick="incrementWater()">+1</button> <button class="btn-secondary btn btn-small" onclick="decrementWater()">-1</button>
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-value" id="studyHours">
       0
      </div>
      <div class="stat-label">
       ساعات الدراسة
      </div>
      <div class="stat-controls"><button class="btn btn-small" onclick="incrementStudy()">+1</button> <button class="btn-secondary btn btn-small" onclick="decrementStudy()">-1</button>
      </div>
     </div>
    </div>
   </div><!-- Notes -->
   <div class="neon-card">
    <h2 class="card-title" id="notesTitle">ملاحظاتك السريعة</h2>
    <div class="notes-content" id="notesContent">
     لا توجد ملاحظات بعد
    </div><button class="btn btn-small" onclick="openNotesModal()" style="margin-top: 15px;"> ✏️ تعديل الملاحظات </button>
   </div>
  </div><!-- Add Schedule Modal -->
  <div class="modal" id="scheduleModal">
   <div class="modal-content">
    <h3 class="modal-title">إضافة حصة جديدة</h3>
    <form id="scheduleForm" onsubmit="addSchedule(event)">
     <div class="form-group"><label class="form-label" for="scheduleTime">الوقت</label> <input type="time" id="scheduleTime" class="form-input" required>
     </div>
     <div class="form-group"><label class="form-label" for="scheduleSubject">المادة</label> <input type="text" id="scheduleSubject" class="form-input" placeholder="مثال: رياضيات" required>
     </div>
     <div class="form-group"><label class="form-label" for="scheduleDuration">المدة (دقيقة)</label> <input type="number" id="scheduleDuration" class="form-input" placeholder="50" min="1" required>
     </div>
     <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeScheduleModal()">إلغاء</button> <button type="submit" class="btn">إضافة</button>
     </div>
    </form>
   </div>
  </div><!-- Add Goal Modal -->
  <div class="modal" id="goalModal">
   <div class="modal-content">
    <h3 class="modal-title">إضافة هدف جديد</h3>
    <form id="goalForm" onsubmit="addGoal(event)">
     <div class="form-group"><label class="form-label" for="goalText">الهدف</label> <input type="text" id="goalText" class="form-input" placeholder="مثال: أنهي واجب الرياضيات" required>
     </div>
     <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeGoalModal()">إلغاء</button> <button type="submit" class="btn">إضافة</button>
     </div>
    </form>
   </div>
  </div><!-- Edit Notes Modal -->
  <div class="modal" id="notesModal">
   <div class="modal-content">
    <h3 class="modal-title">تعديل الملاحظات</h3>
    <form id="notesForm" onsubmit="saveNotes(event)">
     <div class="form-group"><label class="form-label" for="notesTextarea">ملاحظاتك</label> <textarea id="notesTextarea" class="form-input" placeholder="اكتب ملاحظاتك هنا..."></textarea>
     </div>
     <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeNotesModal()">إلغاء</button> <button type="submit" class="btn">حفظ</button>
     </div>
    </form>
   </div>
  </div>
  <!-- المصمم والمبرمج الموقع -->
  <footer id="Footerprogram" class="Footer-Program">
    <a href="https://www.facebook.com/Mohamed.Hany.2026/" id="afot" class="a-fot">صمم بواسطة Mohamed Hany</a>
</footer>

</html>
